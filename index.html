<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyeong™</title>
  <meta name="description" content="hyeong™ — Design Studio">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===================================================
       hyeong™ 메인 커버 슬라이드쇼
       - Real Cover 이미지 6장을 전체 화면에 채우고 3초마다 부드럽게 전환
       =================================================== */
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
    }

    /* 메인 커버 컨테이너 */
    .hero-slideshow-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    /* 슬라이드 아이템들 */
    .slide-item {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 6s cubic-bezier(0.1, 0, 0.2, 1);
      transform: scale(1.04);
      will-change: opacity, transform;
    }

    .slide-item.is-active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      z-index: 2;
    }

    .slide-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* 은은한 비네팅 오버레이 (헤더 가독성 및 세련된 톤 확보) */
    .slideshow-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* 인덱스 페이지 헤더 투명화 및 화이트 대비 */
    .site-header {
      background: transparent !important;
    }

    .logo img {
      filter: brightness(0) invert(1);
    }

    .main-nav a {
      color: #ffffff !important;
    }

    .main-nav a:hover {
      opacity: 0.7;
    }

    .menu-toggle span {
      background: #ffffff !important;
    }

    /* 하단 미니멀 인디케이터 및 컨트롤 */
    .slide-footer-info {
      position: fixed;
      bottom: 28px;
      left: 0;
      width: 100%;
      padding: 0 var(--pad);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.1px;
      color: #ffffff;
      z-index: 20;
      pointer-events: auto;
    }

    .slide-counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    .slide-bars {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .slide-bar {
      width: 24px;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .slide-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    .slide-bar.is-active .slide-bar-fill {
      width: 100%;
      transition: width 3s linear;
    }

    .slide-bar.is-passed .slide-bar-fill {
      width: 100%;
    }

    .slide-enter-link {
      color: #ffffff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .slide-enter-link:hover {
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- 헤더 (투명) -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="LOGO.png" alt="hyeong™">
      </a>
      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="about.html">Studio</a>
        <a href="work.html">Work</a>
        <a href="https://smartstore.naver.com/hyeong_studio/products/13724689293" target="_blank" rel="noopener noreferrer">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- 메인 Real Cover 슬라이드쇼 스테이지 -->
  <main class="hero-slideshow-wrap" id="slideshowWrap">
    
    <div class="slideshow-overlay"></div>

    <!-- Real Cover 이미지 6장 -->
    <div class="slide-item is-active" data-index="0">
      <img src="Real Cover/SITE/Frame 51.png" alt="hyeong™ Cover 01">
    </div>
    <div class="slide-item" data-index="1">
      <img src="Real Cover/SITE/Frame 52.png" alt="hyeong™ Cover 02">
    </div>
    <div class="slide-item" data-index="2">
      <img src="Real Cover/SITE/Frame 53.png" alt="hyeong™ Cover 03">
    </div>
    <div class="slide-item" data-index="3">
      <img src="Real Cover/SITE/Frame 54.png" alt="hyeong™ Cover 04">
    </div>
    <div class="slide-item" data-index="4">
      <img src="Real Cover/SITE/Frame 55.png" alt="hyeong™ Cover 05">
    </div>
    <div class="slide-item" data-index="5">
      <img src="Real Cover/SITE/Frame 56.png" alt="hyeong™ Cover 06">
    </div>

    <!-- 하단 미니멀 슬라이드 정보 및 인디케이터 -->
    <div class="slide-footer-info">
      <div class="slide-counter">
        <span id="currentSlideNum">01</span> / 06
      </div>

      <div class="slide-bars" id="slideBars">
        <div class="slide-bar is-active"><div class="slide-bar-fill"></div></div>
        <div class="slide-bar"><div class="slide-bar-fill"></div></div>
        <div class="slide-bar"><div class="slide-bar-fill"></div></div>
        <div class="slide-bar"><div class="slide-bar-fill"></div></div>
        <div class="slide-bar"><div class="slide-bar-fill"></div></div>
        <div class="slide-bar"><div class="slide-bar-fill"></div></div>
      </div>

      <a href="about.html" class="slide-enter-link">Enter Studio</a>
    </div>

  </main>

  <script src="js/main.js"></script>
  <script>
    /* ── Real Cover 3초 자동 전환 슬라이드쇼 스크립트 ── */
    const slides = document.querySelectorAll('.slide-item');
    const bars = document.querySelectorAll('.slide-bar');
    const currentNumEl = document.getElementById('currentSlideNum');
    const totalSlides = slides.length;
    let currentIndex = 0;
    const intervalDuration = 3000; // 3초 (3000ms)
    let slideTimer = null;

    function showSlide(index) {
      // 기존 슬라이드 비활성화
      slides.forEach((slide, i) => {
        slide.classList.remove('is-active');
        if (i === index) {
          slide.classList.add('is-active');
        }
      });

      // 바 인디케이터 상태 업데이트
      bars.forEach((bar, i) => {
        bar.classList.remove('is-active', 'is-passed');
        const fill = bar.querySelector('.slide-bar-fill');
        fill.style.transition = 'none';
        fill.style.width = '0%';
        
        if (i < index) {
          bar.classList.add('is-passed');
          fill.style.width = '100%';
        } else if (i === index) {
          // 강제 리플로우 후 3초 애니메이션 시작
          void bar.offsetWidth;
          bar.classList.add('is-active');
          fill.style.transition = `width ${intervalDuration}ms linear`;
          fill.style.width = '100%';
        }
      });

      // 번호 텍스트 갱신 (01 ~ 06)
      currentNumEl.textContent = String(index + 1).padStart(2, '0');
      currentIndex = index;
    }

    function nextSlide() {
      const nextIndex = (currentIndex + 1) % totalSlides;
      showSlide(nextIndex);
    }

    function startAutoSlide() {
      if (slideTimer) clearInterval(slideTimer);
      // 첫 슬라이드 바 애니메이션 시작
      showSlide(0);
      slideTimer = setInterval(nextSlide, intervalDuration);
    }

    // 클릭 시 해당 슬라이드로 바로 이동
    bars.forEach((bar, i) => {
      bar.addEventListener('click', () => {
        clearInterval(slideTimer);
        showSlide(i);
        slideTimer = setInterval(nextSlide, intervalDuration);
      });
    });

    // 화면 클릭 시 다음 슬라이드로 넘어가는 직관적인 제스처 지원 (링크/바 제외)
    document.getElementById('slideshowWrap').addEventListener('click', (e) => {
      if (e.target.closest('.slide-bars') || e.target.closest('a') || e.target.closest('header')) return;
      clearInterval(slideTimer);
      nextSlide();
      slideTimer = setInterval(nextSlide, intervalDuration);
    });

    // 키보드 좌우 방향키로도 슬라이드 제어 가능
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        clearInterval(slideTimer);
        nextSlide();
        slideTimer = setInterval(nextSlide, intervalDuration);
      } else if (e.key === 'ArrowLeft') {
        clearInterval(slideTimer);
        const prevIndex = (currentIndex - 1 + totalSlides) % totalSlides;
        showSlide(prevIndex);
        slideTimer = setInterval(nextSlide, intervalDuration);
      }
    });

    // 시작
    startAutoSlide();
  </script>
</body>
</html>
