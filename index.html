<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyeong™</title>
  <meta name="description" content="hyeong™ — Design Studio">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===================================================
       해외 하이엔드 스튜디오 감성: 
       Interactive Kinetic Logo + Cursor Image Trail Archive
       - 글씨 없이 오직 로고와 마우스 커서 궤적에 반응하는 스튜디오 작품들
       =================================================== */
    html, body {
      height: 100%;
      overflow: hidden;
      background: #ececec;
      cursor: crosshair; /* 감각적인 미니멀 십자 커서 */
      user-select: none;
    }

    /* 메인 캔버스 스테이지 */
    .hero-interactive-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      overflow: hidden;
      z-index: 2;
    }

    /* 마우스 커서 반응 3D 키네틱 로고 컨테이너 */
    .kinetic-logo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 10;
      pointer-events: auto;
    }

    /* 중앙 대형 시그니처 로고 */
    .kinetic-logo {
      width: clamp(340px, 50vw, 840px);
      height: auto;
      display: block;
      cursor: pointer;
      mix-blend-mode: multiply;
      transition: filter 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .kinetic-logo-wrap:hover .kinetic-logo {
      filter: drop-shadow(0 30px 45px rgba(0, 0, 0, 0.15));
      transform: scale(1.025);
    }

    /* 마우스 궤적을 따라 피어나는 이미지 트레일(Image Trail) 컨테이너 */
    .trail-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .trail-item {
      position: absolute;
      top: 0;
      left: 0;
      width: clamp(170px, 18vw, 290px);
      aspect-ratio: 4 / 5;
      pointer-events: none;
      border-radius: 1px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.16);
      background: #dfdfdf;
      transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      opacity: 0;
      will-change: transform, opacity;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .trail-item.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(var(--rot, 0deg));
    }

    .trail-item.is-fading {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.06) rotate(var(--rot, 0deg));
    }

    .trail-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 하단 미니멀 진입 태그 */
    .stage-bottom-info {
      position: fixed;
      bottom: 28px;
      left: 0;
      width: 100%;
      padding: 0 var(--pad);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.1px;
      color: #000000;
      z-index: 20;
      pointer-events: auto;
    }

    .studio-status-dot {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .studio-status-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #0033ff;
      border-radius: 50%;
      display: inline-block;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }

    .stage-enter-link {
      color: #000000;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .stage-enter-link:hover {
      opacity: 0.5;
      transform: translateX(3px);
    }

    @media (max-width: 768px) {
      .kinetic-logo {
        width: 84vw;
      }
      .trail-item {
        width: 150px;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="LOGO.png" alt="hyeong™">
      </a>
      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="about.html">Studio</a>
        <a href="work.html">Work</a>
        <a href="https://smartstore.naver.com/hyeong_studio/products/13724689293" target="_blank" rel="noopener noreferrer">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- 마우스 궤적 이미지 트레일 캔버스 -->
  <div class="trail-canvas" id="trailCanvas"></div>

  <!-- 마우스 반응형 로고 스테이지 -->
  <main class="hero-interactive-stage" id="interactiveStage">
    
    <div class="kinetic-logo-wrap" id="kineticLogoWrap">
      <a href="about.html" title="Enter Studio">
        <img src="LOGO.png" alt="hyeong™" class="kinetic-logo">
      </a>
    </div>

    <!-- 하단 미니멀 정보 -->
    <div class="stage-bottom-info">
      <span class="studio-status-dot">Industrial Design Studio</span>
      <a href="about.html" class="stage-enter-link">Enter Studio →</a>
    </div>

  </main>

  <script src="js/main.js"></script>
  <script>
    /* ── 해외 에이전시 스타일: 3D 키네틱 로고 & 인터랙티브 커서 이미지 트레일 ── */
    const stage = document.getElementById('interactiveStage');
    const logoWrap = document.getElementById('kineticLogoWrap');
    const trailCanvas = document.getElementById('trailCanvas');

    // 마우스가 이동할 때마다 궤적에 순차적으로 펼쳐질 스튜디오 대표작 비주얼 풀
    const trailImages = [
      '01-WORK-COVERS/Dropmate-new.png',
      '01-WORK-COVERS/Grip-cover.png',
      '01-WORK-COVERS/Jin.png',
      '01-WORK-COVERS/siseon.png',
      '01-WORK-COVERS/name.png',
      '01-WORK-COVERS/gleam.png',
      '00-PORTFOLIO_WEBSITE/cover-01.png',
      '00-PORTFOLIO_WEBSITE/cover-06.png',
      '00-PORTFOLIO_WEBSITE/new-01.png',
      '00-PORTFOLIO_WEBSITE/cover-03.png'
    ];

    let currentImgIdx = 0;
    let lastTrailX = 0;
    let lastTrailY = 0;
    const trailDistanceThreshold = 85; // 이미지가 생성되는 마우스 최소 이동 거리 (px)

    // 3D 틸트 물리 변수
    let targetRotX = 0;
    let targetRotY = 0;
    let targetTransX = 0;
    let targetTransY = 0;

    let curRotX = 0;
    let curRotY = 0;
    let curTransX = 0;
    let curTransY = 0;

    // 마우스 이동 시 1) 3D 로고 틸트 각도 계산 + 2) 마우스 커서 위치에 이미지 트레일 생성
    window.addEventListener('mousemove', (e) => {
      const { clientX: x, clientY: y } = e;
      const { innerWidth: w, innerHeight: h } = window;

      // 3D 로고 반응값
      const normX = (x / w - 0.5) * 2;
      const normY = (y / h - 0.5) * 2;

      targetRotY = normX * 18;  // 좌우 회전 각도
      targetRotX = -normY * 18; // 상하 회전 각도
      targetTransX = normX * 28; // 좌우 이동거리
      targetTransY = normY * 24; // 상하 이동거리

      // 마우스 이동 거리가 임계값을 넘으면 감각적인 작품 이미지 팝업
      const dist = Math.hypot(x - lastTrailX, y - lastTrailY);
      if (dist > trailDistanceThreshold) {
        spawnTrailItem(x, y);
        lastTrailX = x;
        lastTrailY = y;
      }
    });

    window.addEventListener('mouseleave', () => {
      targetRotX = 0;
      targetRotY = 0;
      targetTransX = 0;
      targetTransY = 0;
    });

    // 궤적에 이미지를 생성하고 자연스럽게 페이드아웃시키는 함수
    function spawnTrailItem(x, y) {
      const imgPath = trailImages[currentImgIdx];
      currentImgIdx = (currentImgIdx + 1) % trailImages.length;

      const item = document.createElement('div');
      item.className = 'trail-item';
      item.style.left = `${x}px`;
      item.style.top = `${y}px`;

      // 미세하고 자연스러운 랜덤 회전각 (-7도 ~ +7도)
      const randomRot = (Math.random() - 0.5) * 14;
      item.style.setProperty('--rot', `${randomRot}deg`);

      const img = document.createElement('img');
      img.src = imgPath;
      img.alt = 'hyeong studio archive';
      item.appendChild(img);

      trailCanvas.appendChild(item);

      // 다음 프레임에서 나타남
      requestAnimationFrame(() => {
        item.classList.add('is-visible');
      });

      // 일정 시간 후 부드럽게 페이드아웃 후 제거
      setTimeout(() => {
        item.classList.remove('is-visible');
        item.classList.add('is-fading');
        setTimeout(() => {
          if (item.parentNode) {
            item.parentNode.removeChild(item);
          }
        }, 700);
      }, 650);
    }

    // RAF 부드러운 스프링 물리 렌더러
    function renderLoop() {
      curRotX += (targetRotX - curRotX) * 0.08;
      curRotY += (targetRotY - curRotY) * 0.08;
      curTransX += (targetTransX - curTransX) * 0.08;
      curTransY += (targetTransY - curTransY) * 0.08;

      logoWrap.style.transform = `
        rotateX(${curRotX.toFixed(2)}deg) 
        rotateY(${curRotY.toFixed(2)}deg) 
        translate3d(${curTransX.toFixed(2)}px, ${curTransY.toFixed(2)}px, 40px)
      `;

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
