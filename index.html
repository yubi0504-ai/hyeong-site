<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyeong™</title>
  <meta name="description" content="hyeong™ — Design Studio">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===================================================
       1번 옵션: 풀스크린 시네마틱 릴 (Full-screen Cinematic Reel)
       - 불필요한 텍스트 배제, 화면 전체(100vh)를 채우는 영상 중심
       - 추후 video 파일 경로만 교체하면 바로 변경 가능
       =================================================== */
    html, body {
      height: 100%;
      overflow: hidden; /* 풀스크린 뷰포트 고정 */
      background: #000000;
    }

    /* 메인 인덱스에서는 헤더를 시네마틱 오버레이 형태로 투명 처리 */
    .site-header {
      background: transparent !important;
      transition: opacity 0.3s ease;
    }

    /* 배경이 어두운 영상 위에서 로고 및 내비게이션 텍스트가 반전/선명하게 보이도록 mix-blend-mode 적용 */
    .site-header .header-inner {
      mix-blend-mode: difference;
    }

    .site-header .logo img {
      filter: invert(1); /* 블랙 로고를 화이트로 반전 */
    }

    .main-nav a {
      color: #ffffff !important;
    }

    .main-nav a.active {
      color: #ffffff !important;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .menu-toggle span {
      background: #ffffff !important;
    }

    /* 풀스크린 비디오 릴 래퍼 */
    .cinema-reel-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cinema-reel-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      pointer-events: none;
    }

    /* 화면 하단 미니멀 컨트롤 / 진입 바 */
    .cinema-reel-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0 var(--pad) 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      mix-blend-mode: difference;
      pointer-events: auto;
    }

    .cinema-reel-sound-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .cinema-reel-sound-btn:hover {
      opacity: 1;
    }

    .cinema-reel-enter {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .cinema-reel-enter:hover {
      opacity: 1;
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <!-- 헤더 (투명 오버레이 + 반전 모드) -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="LOGO.png" alt="hyeong™">
      </a>
      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="about.html">Studio</a>
        <a href="work.html">Work</a>
        <a href="https://smartstore.naver.com/hyeong_studio/products/13724689293" target="_blank" rel="noopener noreferrer">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- 풀스크린 시네마틱 릴 영역 -->
  <!-- ※ 추후 비디오 변경 시: video 태그의 src 경로만 원하시는 파일로 교체하시면 됩니다 -->
  <main class="cinema-reel-wrapper">
    <video 
      id="heroReelVideo"
      class="cinema-reel-video" 
      src="video/grip-video.mp4" 
      autoplay 
      muted 
      loop 
      playsinline>
    </video>

    <!-- 하단 미니멀 오버레이 (소리 켜기/끄기 & Work 전체 보기 링크) -->
    <div class="cinema-reel-footer">
      <button type="button" class="cinema-reel-sound-btn" id="soundToggleBtn">
        Sound [Off]
      </button>

      <a href="work.html" class="cinema-reel-enter">
        Explore Work →
      </a>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    // 오디오 토글 제어 (사용자가 소리를 켜서 감상할 수 있도록 지원)
    const video = document.getElementById('heroReelVideo');
    const soundBtn = document.getElementById('soundToggleBtn');

    if (video && soundBtn) {
      soundBtn.addEventListener('click', () => {
        if (video.muted) {
          video.muted = false;
          soundBtn.textContent = 'Sound [On]';
        } else {
          video.muted = true;
          soundBtn.textContent = 'Sound [Off]';
        }
      });
    }
  </script>
</body>
</html>
