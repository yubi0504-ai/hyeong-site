<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyeong™</title>
  <meta name="description" content="hyeong™ — Design Studio">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 메인 인덱스: 글씨를 최소화하고 작품 비주얼에 몰입하는 미니멀 쇼케이스 */
    .home-main {
      padding-top: calc(var(--header-h) + 20px);
      padding-bottom: 80px;
      width: 100%;
    }

    .home-showcase-container {
      width: 100%;
      padding: 0 var(--pad);
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* 상단 대형 비디오 히어로 (Grip 시네마틱) */
    .home-hero-media {
      width: 100%;
      height: 75vh;
      min-height: 480px;
      max-height: 800px;
      position: relative;
      overflow: hidden;
      background: #000000;
      display: block;
      text-decoration: none;
    }

    .home-hero-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .home-hero-media:hover video {
      transform: scale(1.02);
      opacity: 0.92;
    }

    .home-hero-badge {
      position: absolute;
      bottom: 24px;
      left: 24px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
      mix-blend-mode: difference;
      pointer-events: none;
    }

    /* 하단 핵심 작품 3열 미니멀 그리드 */
    .home-works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
    }

    .home-work-item {
      display: block;
      text-decoration: none;
      color: #000000;
      position: relative;
    }

    .home-work-item__thumb {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #eaeaea;
      position: relative;
      margin-bottom: 10px;
    }

    .home-work-item__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .home-work-item:hover .home-work-item__thumb img {
      transform: scale(1.03);
    }

    .home-work-item__info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .home-work-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .home-work-arrow {
      font-size: 12px;
      font-weight: 700;
      opacity: 0.5;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .home-work-item:hover .home-work-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    /* 반응형 */
    @media (max-width: 900px) {
      .home-hero-media {
        height: 55vh;
        min-height: 360px;
      }
      .home-works-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="LOGO.png" alt="hyeong™">
      </a>
      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="about.html">Studio</a>
        <a href="work.html">Work</a>
        <a href="https://smartstore.naver.com/hyeong_studio/products/13724689293" target="_blank" rel="noopener noreferrer">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- 메인 본문: 순수 비주얼 쇼케이스 -->
  <main class="home-main">
    <div class="home-showcase-container">

      <!-- ① 메인 풀와이드 비디오 (Grip 동작 모션) -->
      <a href="works/grip.html" class="home-hero-media">
        <video src="video/grip-video.mp4" autoplay muted loop playsinline></video>
        <div class="home-hero-badge">
          <span>Grip</span>
          <span>↗</span>
        </div>
      </a>

      <!-- ② 대표 작품 미니멀 비주얼 3열 그리드 -->
      <div class="home-works-grid">

        <!-- 작품 1: Dropmate -->
        <a href="works/dropmate.html" class="home-work-item">
          <div class="home-work-item__thumb">
            <img src="01-WORK-COVERS/Dropmate-new.png" alt="Dropmate">
          </div>
          <div class="home-work-item__info">
            <span class="home-work-title">Dropmate</span>
            <span class="home-work-arrow">↗</span>
          </div>
        </a>

        <!-- 작품 2: Jjindobaegi -->
        <a href="works/jin.html" class="home-work-item">
          <div class="home-work-item__thumb">
            <img src="01-WORK-COVERS/Jin.png" alt="Jjindobaegi">
          </div>
          <div class="home-work-item__info">
            <span class="home-work-title">Jjindobaegi</span>
            <span class="home-work-arrow">↗</span>
          </div>
        </a>

        <!-- 작품 3: siseon -->
        <a href="works/siseon.html" class="home-work-item">
          <div class="home-work-item__thumb">
            <img src="01-WORK-COVERS/siseon.png" alt="siseon">
          </div>
          <div class="home-work-item__info">
            <span class="home-work-title">siseon</span>
            <span class="home-work-arrow">↗</span>
          </div>
        </a>

      </div>

    </div>
  </main>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copyright">© 2024 hyeong™ All Rights Reserved.</p>
      <div class="footer-links">
        <a href="https://www.instagram.com/hyeong2_studio?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw" target="_blank" rel="noopener">Instagram</a>
        <a href="mailto:hyeongdesign@gmail.com">Email</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
