<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyeong™</title>
  <meta name="description" content="hyeong™ — Design Studio">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===================================================
       hyeong™ 메인 커버 슬라이드쇼
       - Real Cover 이미지가 잘리지 않고 중앙에 집중감 있게 배치
       - 5초마다 부드럽고 우아하게 전환
       - 인위적인 상하 검정 페이드 제거
       =================================================== */
    html, body {
      height: 100%;
      overflow: hidden;
      background: #efefef;
      user-select: none;
    }

    /* 메인 커버 컨테이너 */
    .hero-slideshow-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #efefef;
    }

    /* 슬라이드 아이템들 (깔끔하고 신속한 크로스페이드) */
    .slide-item {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(60px, 8vh, 100px) clamp(24px, 6vw, 80px);
      opacity: 0;
      visibility: hidden;
      z-index: 1;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      will-change: opacity;
    }

    /* 직전 활성화 슬라이드: 새 슬라이드가 들어오는 동안 잔상 없이 신속히 퇴장 */
    .slide-item.is-previous {
      opacity: 0;
      visibility: visible;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    /* 현재 활성화 슬라이드 */
    .slide-item.is-active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
      transition: opacity 0.4s ease;
    }

    /* 이미지가 잘리지 않고 단정하고 작게 보이도록 contain 처리 */
    .slide-item img {
      max-width: 82%;
      max-height: 72vh;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      display: block;
      margin: auto;
      pointer-events: none;
      filter: none; /* 외곽선 및 톤 차이(그림자 번짐) 방지를 위해 제거 */
    }

    /* 세로형 두 번째 이미지(DropMate)의 비율 및 단정한 크기 밸런스 */
    .slide-item img.img-dropmate {
      max-width: 45%;
      max-height: 68vh;
    }

    /* 상하 검정 페이드 제거: 깔끔한 투명 헤더 및 기존 사이트 톤 유지 */
    .site-header {
      background: transparent !important;
    }

    .logo img {
      filter: none; /* 오리지널 블랙 로고 유지 */
    }

    .main-nav a {
      color: #000000 !important; /* 순수 블랙 폰트 */
    }

    .main-nav a:hover {
      opacity: 0.5;
    }

    .menu-toggle span {
      background: #000000 !important;
    }

    /* 하단 미니멀 인디케이터 및 컨트롤 */
    .slide-footer-info {
      position: fixed;
      bottom: 28px;
      left: 0;
      width: 100%;
      padding: 0 var(--pad);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.1px;
      color: #000000;
      z-index: 20;
      pointer-events: auto;
    }

    .slide-counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    .slide-enter-link {
      color: #000000;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .slide-enter-link:hover {
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .slide-item {
        /* 모바일 헤더/푸터 공간 확보 및 좌우 여백을 줄여 가로형 이미지 캔버스가 크게 보이도록 설정 */
        padding: 55px 12px 65px;
      }
      /* 가로형 이미지(1, 3, 4, 5, 6번): 화면 너비에 맞게 시원하고 큼직하게 확대 */
      .slide-item img {
        max-width: 98%;
        max-height: 56vh;
      }
      /* 세로형 이미지(2번 DropMate): 다른 가로형 오브젝트들과 체감 크기가 균형을 이루도록 적절한 크기로 조정 */
      .slide-item img.img-dropmate {
        max-width: 32%;
        max-height: 40vh;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 (투명) -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="LOGO.png" alt="hyeong™">
      </a>
      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav">
        <a href="about.html">Studio</a>
        <a href="work.html">Work</a>
        <a href="https://smartstore.naver.com/hyeong_studio/products/13724689293" target="_blank" rel="noopener noreferrer">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- 메인 Real Cover 슬라이드쇼 스테이지 -->
  <main class="hero-slideshow-wrap" id="slideshowWrap">

    <!-- Real Cover 이미지 6장 (새 파일명 반영) -->
    <div class="slide-item is-active" data-index="0">
      <img src="Real Cover/SITE/Frame 51.png" alt="hyeong™ Cover 01">
    </div>
    <div class="slide-item" data-index="1">
      <img src="Real Cover/SITE/DropMate-vertical.png" alt="hyeong™ Cover 02" class="img-dropmate">
    </div>
    <div class="slide-item" data-index="2">
      <img src="Real Cover/SITE/Frame 58.png" alt="hyeong™ Cover 03">
    </div>
    <div class="slide-item" data-index="3">
      <img src="Real Cover/SITE/Frame 59.png" alt="hyeong™ Cover 04">
    </div>
    <div class="slide-item" data-index="4">
      <img src="Real Cover/SITE/Frame 60.png" alt="hyeong™ Cover 05">
    </div>
    <div class="slide-item" data-index="5">
      <img src="Real Cover/SITE/Frame 61.png" alt="hyeong™ Cover 06">
    </div>

    <!-- 하단 미니멀 슬라이드 정보 -->
    <div class="slide-footer-info">
      <div class="slide-counter">
        <span id="currentSlideNum">01</span> / 06
      </div>

      <a href="about.html" class="slide-enter-link">Enter Studio</a>
    </div>

  </main>

  <script src="js/main.js"></script>
  <script>
    /* ── Real Cover 3초 자동 전환 슬라이드쇼 스크립트 ── */
    const slides = document.querySelectorAll('.slide-item');
    const currentNumEl = document.getElementById('currentSlideNum');
    const totalSlides = slides.length;
    let currentIndex = 0;
    const intervalDuration = 3000; // 3초 (3000ms)
    let slideTimer = null;

    function showSlide(index) {
      if (index === currentIndex && slides[index].classList.contains('is-active')) {
        return;
      }

      const prevIndex = currentIndex;
      const prevSlide = slides[prevIndex];
      const nextSlideEl = slides[index];

      // 이전 슬라이드는 밑(z-index: 1)에 그대로 두고, 새 슬라이드를 위(z-index: 2)에서 부드럽게 페이드인
      slides.forEach((slide) => {
        slide.classList.remove('is-previous');
      });

      if (prevSlide && prevSlide !== nextSlideEl) {
        prevSlide.classList.add('is-previous');
        prevSlide.classList.remove('is-active');
      }

      nextSlideEl.classList.add('is-active');

      // 번호 텍스트 갱신 (01 ~ 06)
      currentNumEl.textContent = String(index + 1).padStart(2, '0');
      currentIndex = index;

      // 트랜지션 완료(400ms) 후 이전 슬라이드의 클래스 정리
      setTimeout(() => {
        if (prevSlide && prevSlide !== slides[currentIndex]) {
          prevSlide.classList.remove('is-previous');
        }
      }, 420);
    }

    function nextSlide() {
      const nextIndex = (currentIndex + 1) % totalSlides;
      showSlide(nextIndex);
    }

    function startAutoSlide() {
      if (slideTimer) clearInterval(slideTimer);
      showSlide(0);
      slideTimer = setInterval(nextSlide, intervalDuration);
    }

    // 화면 클릭 시 다음 슬라이드로 넘어가는 직관적인 제스처 지원 (링크 및 헤더 제외)
    document.getElementById('slideshowWrap').addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('header')) return;
      clearInterval(slideTimer);
      nextSlide();
      slideTimer = setInterval(nextSlide, intervalDuration);
    });

    // 키보드 좌우 방향키로도 슬라이드 제어 가능
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        clearInterval(slideTimer);
        nextSlide();
        slideTimer = setInterval(nextSlide, intervalDuration);
      } else if (e.key === 'ArrowLeft') {
        clearInterval(slideTimer);
        const prevIndex = (currentIndex - 1 + totalSlides) % totalSlides;
        showSlide(prevIndex);
        slideTimer = setInterval(nextSlide, intervalDuration);
      }
    });

    // 시작
    startAutoSlide();
  </script>
</body>
</html>
